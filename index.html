<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
        }
        h1 {
            text-align: center;
            color: #3498db;
            margin-bottom: 20px;
            margin-top: 12px;
            font-weight: bold;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            font-size: 14px;
            color: #34495e;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #dfe6e9;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .input-group input:focus,
        .input-group select:focus {
            border-color: #3498db;
            outline: none;
        }
        #customTipInput {
            display: none;
            margin-top: 10px;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: lightblue;
        }
        .result {
            margin-top: 25px;
            font-size: 16px;
            color: #34495e;
            padding: 15px;
            background-color: #ecf0f1;
            border-radius: 8px;
            border: 1px solid #bdc3c7;
            text-align: center;
            display: none; /* Initially hidden */
        }
        .result p {
            margin: 10px 0;
        }
        .result strong {
            color: #2c3e50;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Tip Calculator</h1>
    <div class="input-group">
        <label for="amount">Bill Amount (₹)</label>
        <input type="number" id="amount" placeholder="Enter Bill Amount in ₹" min="0" required>
    </div>
    <div class="input-group">
        <label for="tipPercentage">Tip Percentage (%)</label>
        <select id="tipPercentage" onchange="toggleCustomTipInput()">
            <option value="none" default>Select Percentage</option>
            <option value="10">10%</option>
            <option value="15">15%</option>
            <option value="20">20%</option>
            <option value="25">25%</option>
            <option value="30">30%</option>
            <option value="custom">Custom</option>
        </select>
        <div id="customTipInput">
            <label for="customTipPercentage">Enter Custom Percentage</label>
            <input type="number" id="customTipPercentage" placeholder="Enter Custom Percentage" min="0" max="100">
        </div>
    </div>
    <div class="input-group">
        <label for="people">Number of People</label>
        <input type="number" id="people" value="1" min="1" required>
    </div>
    <button onclick="calculateTip()">Calculate</button>

    <div class="result" id="result">
        <!-- Result will be displayed here -->
    </div>
</div>

<script>
    function toggleCustomTipInput() {
        const tipPercentage = document.getElementById('tipPercentage').value;
        const customTipInput = document.getElementById('customTipInput');
        
        if (tipPercentage === 'custom') {
            customTipInput.style.display = 'block';
        } else {
            customTipInput.style.display = 'none';
            document.getElementById('customTipPercentage').value = ''; // Reset custom tip value
        }
    }

    function calculateTip() {
        const amount = parseFloat(document.getElementById('amount').value);
        let tipPercentage = document.getElementById('tipPercentage').value;
        const customTipPercentage = parseFloat(document.getElementById('customTipPercentage').value);
        const people = parseInt(document.getElementById('people').value);

        if (isNaN(amount) || amount <= 0) {
            alert("Please enter a valid bill amount.");
            return;
        }

        if (tipPercentage === 'none') {
            alert("Please select a tip percentage.");
            return;
        }

        if (tipPercentage === 'custom') {
            if (!isNaN(customTipPercentage) && customTipPercentage > 0 && customTipPercentage <= 100) {
                tipPercentage = customTipPercentage;
            } else {
                alert("Please enter a valid custom tip percentage (0–100).");
                return;
            }
        } else {
            tipPercentage = parseFloat(tipPercentage);
        }

        if (isNaN(people) || people <= 0) {
            alert("Please enter a valid number of people.");
            return;
        }

        const tipAmount = (amount * tipPercentage) / 100;
        const totalAmount = amount + tipAmount;
        const tipPerPerson = tipAmount / people;
        const totalPerPerson = totalAmount / people;

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block'; // Show result div
        resultDiv.innerHTML = `
            <p><strong>Total Tip: ₹${tipAmount.toFixed(2)}</strong></p>
            <p><strong>Total Amount: ₹${totalAmount.toFixed(2)}</strong></p>
            <p><strong>Tip Per Person: ₹${tipPerPerson.toFixed(2)}</strong></p>
            <p><strong>Total Per Person: ₹${totalPerPerson.toFixed(2)}</strong></p>
        `;
    }
</script>
</body>
</html>
